<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>UAT Sign-Off Portal</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>

<body>
  <iframe id="appFrame" allowfullscreen></iframe>

  <script>
    const APP_BASE_URL = "https://script.google.com/macros/s/AKfycbz5AMs8otZ9cXMZAIPRZgxi0Nk5sPkS3gH8i5lvPVSlvjyv4ia9KJ_eser2c23Wm9400Q/exec";

    // This takes whatever comes after your GitHub URL and passes it to Apps Script
    // Example: /TEST1/?co=1&role=owner
    const queryString = window.location.search;

    document.getElementById("appFrame").src = APP_BASE_URL + queryString;
  </script>
</body>
</html>
